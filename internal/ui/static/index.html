<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydrascale</title>
<!-- Every stylesheet loads from the console origin. The console makes no request to
     another host. brand/tokens/fonts.css names the two self-hosted font files, so this
     page names none. -->
<link rel="stylesheet" href="/brand/tokens/colors.css">
<link rel="stylesheet" href="/brand/tokens/typography.css">
<link rel="stylesheet" href="/brand/tokens/spacing.css">
<link rel="stylesheet" href="/brand/tokens/radius.css">
<link rel="stylesheet" href="/brand/tokens/elevation.css">
<link rel="stylesheet" href="/brand/tokens/motion.css">
<link rel="stylesheet" href="/brand/tokens/fonts.css">
<!-- tokens.css comes after the brand tokens, because it restates the values that the
     brand sets with color-mix, for a browser that reads no color-mix function. -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/brand/logo-lime.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#view-heading">Skip to the view</a>
<div class="app">

  <nav class="nav" aria-label="Main">
    <div class="brand">
      <img class="logo" src="/brand/logo-lime.svg" alt="" width="22" height="22">
      <span class="wordmark">hydra<i>scale</i></span>
    </div>

    <!-- The number of an entry is the key that opens the view. app.js binds the keys. -->
    <div class="nav-index">
      <a class="nav-link" href="#/overview" data-view="overview"><span class="key mono" aria-hidden="true">1</span>Overview</a>
      <a class="nav-link" href="#/namespaces" data-view="namespaces"><span class="key mono" aria-hidden="true">2</span>Namespaces</a>
      <a class="nav-link" href="#/access" data-view="access"><span class="key mono" aria-hidden="true">3</span>Access</a>
      <a class="nav-link" href="#/policy" data-view="policy"><span class="key mono" aria-hidden="true">4</span>Policy</a>
      <a class="nav-link" href="#/activity" data-view="activity"><span class="key mono" aria-hidden="true">5</span>Activity</a>
      <a class="nav-link" href="#/settings" data-view="settings"><span class="key mono" aria-hidden="true">6</span>Settings</a>
    </div>

    <!-- The title block names the daemon that serves this page. app.js writes each value
         from the last poll, and it writes no value that no poll returned. -->
    <dl class="title-block">
      <div><dt>Daemon</dt><dd><span class="mono" id="daemon-version">no version yet</span></dd></div>
      <div><dt>Access</dt><dd><span class="mono" id="title-access">no mode yet</span></dd></div>
      <div><dt>Last tick</dt><dd><span class="mono" id="title-tick">no tick yet</span></dd></div>
    </dl>
  </nav>

  <main class="main" id="main">
    <!-- The poll layer writes this region. It stays hidden while every poll succeeds. -->
    <div class="bar" id="poll-bar" role="status" hidden>
      <span class="dot" id="poll-dot"></span>
      <p class="bar-text" id="poll-text"></p>
      <button class="btn" id="poll-retry" type="button" hidden>Retry now</button>
    </div>

    <header class="head">
      <h1 id="view-heading">Overview</h1>
      <p class="sub" id="view-lead"></p>
    </header>

    <section class="view" id="view-overview" data-view="overview" hidden></section>
    <section class="view" id="view-namespaces" data-view="namespaces" hidden></section>
    <section class="view" id="view-access" data-view="access" hidden></section>
    <section class="view" id="view-policy" data-view="policy" hidden></section>
    <section class="view" id="view-activity" data-view="activity" hidden></section>
    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

</div>
<!-- The content security policy allows no inline script, so app.js binds every handler.
     A view module loads after the shell, and each one calls registerView. Issue #144 adds
     the namespace module. -->
<script type="module" src="/app.js"></script>
<script type="module" src="/overview.js"></script>
<script type="module" src="/namespaces.js"></script>
<script type="module" src="/access.js"></script>
<script type="module" src="/policy.js"></script>
<script type="module" src="/activity.js"></script>
<script type="module" src="/settings.js"></script>
</body>
</html>
