name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Both actions below are pinned to a major version whose action.yml declares
      # "using: node24". This workflow runs on a pull request, therefore it proves the
      # two actions that .github/workflows/release.yml also holds.
      - uses: actions/checkout@v7

      - name: Repository hygiene
        run: scripts/check-hygiene.sh

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Build
        run: go build ./...

      - name: Format
        run: |
          # A developer machine holds an untracked vendor/ after go mod vendor, and gofmt
          # walks it. The filter keeps the same command correct on that machine.
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports that these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        # The runner image ubuntu-latest provides node, and TestTheConsoleJavaScriptTestsPass
        # in internal/ui runs the console JavaScript tests of internal/ui/jstest with it.
        # A later image that drops node fails this step rather than skipping those tests,
        # because GitHub Actions sets CI. See issue 181. The console has no build step and
        # internal/ui/package.json names no dependency, so the workflow installs nothing.
        #
        # The image provides python3 as well, and TestTheSpecificationRendererTestsPass in
        # docs/specs runs the tests of the specification renderer with it. See issue 392.
        run: |
          node --version
          python3 --version
          go test -race -v ./...

      - name: Vulnerability check
        run: |
          # govulncheck exits non-zero only when a reported vulnerability affects a
          # called function, so a vulnerability in an uncalled dependency passes.
          # The version is pinned, because a new release of the tool must not fail the
          # build at an unpredictable moment. The pinned version needs Go 1.25 or later,
          # and the workflow installs the version that go.mod names, which is later.
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
