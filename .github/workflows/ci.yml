name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene
        run: scripts/check-hygiene.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        run: go build ./...

      - name: Format
        run: |
          # gofmt walks vendor/ as well, so the check drops those paths.
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports that these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -v ./...

      - name: Vulnerability check
        run: |
          # govulncheck exits non-zero only when a reported vulnerability affects a
          # called function, so a vulnerability in an uncalled dependency passes.
          # The version is pinned, because a new release of the tool must not fail the
          # build at an unpredictable moment. The pinned version needs Go 1.25, so the
          # Go toolchain rule gets go1.25 for this step alone.
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
