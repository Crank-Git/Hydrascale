name: Docs

# This workflow publishes the documentation site to GitHub Pages (FR-site-39 to
# FR-site-42). It is separate from release.yml, so a failed deploy does not block a
# release. When a deploy fails, the site keeps the last deploy.
#
# The publishing source of the repository must be GitHub Actions. The operator sets it
# once with: gh api -X POST repos/Crank-Git/Hydrascale/pages -f build_type=workflow
#
# Interface: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second deploy waits for the first. A cancelled deploy can leave the site between two
# versions, so the workflow does not cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install the documentation site tools
        run: pip install -r docs/site/requirements.txt

      - name: Build the documentation site
        run: scripts/docs-build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The deploy job alone holds write access. The build job runs code from the
    # repository, so it holds read access only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
