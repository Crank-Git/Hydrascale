name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Daemon: goreleaser builds the Linux binaries and creates the GitHub Release.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # The version is pinned, because "latest" makes the release depend on the
          # newest GoReleaser at the moment the operator pushes the tag. A release that
          # removes a configuration option then fails the release, not a pull request.
          # This version reads the "formats" key that .goreleaser.yaml holds.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
